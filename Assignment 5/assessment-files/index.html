<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Bear Wildlife Page - Accessible</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>All About Bears</h1>
    </header>

    <main>
        <section>
            <h2>Bears in the Wild</h2>
            <img src="media/wild-bear.jpg" alt="A large brown bear standing in a grassy field in the wild.">
            <p>Bears are large mammals found in various habitats around the world.</p>
            
            <audio controls>
                <source src="media/bear.mp3" type="audio/mpeg">
                <source src="media/bear.ogg" type="audio/ogg">
                Your browser does not support the audio element.
            </audio>
            
            <div class="custom-audio-player">
                <button id="play-sound-btn" type="button">Play Bear Roar</button>
            </div>
        </section>

        <section>
            <h2>Urban Bears</h2>
            <img src="media/urban-bear.jpg" alt="A bear foraging for food near urban residential houses.">
            <p>As human developments expand, bears frequently venture into suburban areas.</p>
        </section>

        <section>
            <h2>Bear Information Request</h2>
            <form action="#" method="post">
                <div>
                    <label for="full-name">Full Name:</label>
                    <input type="text" id="full-name" name="full-name" required>
                </div>
                <div>
                    <label for="user-email">Email Address:</label>
                    <input type="email" id="user-email" name="user-email" required>
                </div>
                <div>
                    <button type="submit">Submit Request</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Web Accessibility Tutorial</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
